# /etc/dovecot/local.conf — static configuration (runtime config written by start.sh to conf.d/)

log_path = /dev/stdout
log_timestamp = "%b %d %H:%M:%S "
mail_log_prefix = "%s(%u): "
log_debug = category=auth

# Mail storage — maildir laid out as <domain>/<localpart> (the pre-2.4
# `%d/%n` layout, in 2.4 variable syntax). Must match the on-disk layout of
# existing mailboxes, otherwise every mailbox appears empty after an upgrade.
mail_driver = maildir
mail_path = /var/mail/domains/%{user | domain}/%{user | username}

mail_max_userip_connections = 1000

namespace inbox {
  inbox = yes
}

# Authentication
auth_mechanisms = plain login
auth_allow_cleartext = yes

userdb static {
  fields {
    uid = 5000
    gid = 5000
    # home holds the Sieve scripts (~/.dovecot.sieve, ~/sieve/) — same
    # <domain>/<localpart> layout as mail_path, or filters get orphaned too.
    home = /var/mail/domains/%{user | domain}/%{user | username}
  }
}

# Sieve plugin settings
sieve_max_script_size = 500M
sieve_max_actions = 1024
sieve_max_redirects = 32

# ManageSieve
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
service managesieve {
}

protocol sieve {
  managesieve_max_line_length = 65536
  mail_max_userip_connections = 100
  managesieve_logout_format = bytes=%i/%o
  managesieve_implementation_string = Dovecot Pigeonhole
  managesieve_max_compile_errors = 5
  log_path = /dev/stdout
  info_log_path = /dev/stdout
}

# LDA
quota_full_tempfail = yes
rejection_subject = Rejected: %s
rejection_reason = Your message to <%t> was automatically rejected:%n%r
recipient_delimiter = +
lda_mailbox_autocreate = yes
lda_mailbox_autosubscribe = yes

protocol lda {
  mail_plugins = sieve
}

# LMTP
protocol lmtp {
  mail_plugins = sieve
}

# IMAP — imap_sieve lets us fire sieve scripts on IMAP events
# (MOVE / COPY into or out of a mailbox), which is how Bayes
# autotraining stays event-driven: no cron job, no periodic scan,
# just «user drags mail into Junk» → learn_spam; «user drags out» →
# learn_ham.
protocol imap {
  mail_plugins = imap_sieve
}

# IMAPSieve — one global spam-learn / ham-learn script pair. Fires
# whenever the user MOVEs / COPYs a message into or out of Junk from
# any other mailbox, and pipes the mail through
# /usr/local/bin/report-{spam,ham} → rspamc learn_{spam,ham}.
plugin {
  sieve_plugins = sieve_imapsieve sieve_extprograms

  # sieve_pipe permitted binaries
  sieve_pipe_bin_dir = /usr/local/bin

  # spam: any mailbox → Junk
  imapsieve_mailbox1_name = Junk
  imapsieve_mailbox1_causes = COPY APPEND
  imapsieve_mailbox1_before = file:/etc/dovecot/sieve/learn-spam.sieve

  # ham: Junk → any other mailbox
  imapsieve_mailbox2_name  = *
  imapsieve_mailbox2_from  = Junk
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/etc/dovecot/sieve/learn-ham.sieve

  sieve_extensions = +vnd.dovecot.pipe +vnd.dovecot.environment

  # SPAM_DELIVERY_MODE=folder — deliver mail flagged X-Spam-Flag: YES
  # to the Junk folder instead of INBOX. The `spam-to-junk.sieve` file
  # is generated by start.sh according to the env: an active fileinto
  # rule in `folder` mode, a comment-only no-op otherwise. sieve_before
  # runs before any user sieve script, so users cannot override it.
  sieve_before = /etc/dovecot/sieve/spam-to-junk.sieve
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# SASL socket for Postfix
service auth {
  inet_listener sasl {
    port = 12345
  }
}

protocols = imap pop3 lmtp sieve
